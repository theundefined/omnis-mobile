name: UI tests (demo account)

# Testy instrumentacyjne (app/src/androidTest) na emulatorze, przeciw publicznemu omnis-mock
# (konto demo). Osobno od build.yml: zależą od zewnętrznego serwera, więc nie blokują wydań.
# Push na dowolny branch (nie pull_request — dublowałby przebieg dla tych samych commitów).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build app and test APKs
      run: ./gradlew assembleDebug assembleDebugAndroidTest

    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        script: ./gradlew connectedDebugAndroidTest

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ui-test-reports
        path: app/build/reports/androidTests/
        if-no-files-found: ignore
