name: tmp fmt diff
on:
  push:
    branches: [ ui-test-screenshots ]
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        java-version: '21'
        distribution: 'temurin'
    - run: |
        chmod +x gradlew
        ./gradlew spotlessApply || true
        d=$(git diff | python3 -c 'import sys,urllib.parse;s=sys.stdin.read();print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')
        echo "::warning title=fmtdiff::${d:-NO_DIFF}"
